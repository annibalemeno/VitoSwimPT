<p-table [value]="PianiList"
         dataKey="pianoId"
         [tableStyle]="{ 'min-width': '50rem' }" stripedRows
         [sortField]="sortField"
         [sortOrder]="sortOrder"
         [lazy]="true"
         (onLazyLoad)="loadPianiLazy($event)">
  <ng-template #header>
    <tr>
      <th pSortableColumn="pianoId">
        Id Piano
        <p-sortIcon field="IdPiano" />
      </th>
      <th pSortableColumn="nomePiano">
        Nome
        <p-sortIcon field="Nome" />
      </th>
      <th pSortableColumn="descrizione">
        Descrizione
        <p-sortIcon field="Descrizione" />
      </th>
      <th pSortableColumn="note">
        Note
        <p-sortIcon field="Note" />
      </th>
    </tr>
    <tr>
      <th>
        <p-columnFilter type="text" field="pianoId" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="nomePiano" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="descrizione" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="note" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <button pButton label="Add New" icon="pi pi-plus" (click)="openNew()"></button>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-piano>
    <tr>
      <td>{{ piano.pianoId }}</td>
      <td>{{ piano.nomePiano }}</td>
      <td>{{ piano.descrizione }}</td>
      <td>{{ piano.note }}</td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [(visible)]="displayDialog" styleClass="dialog-fix" header="Nuovo piano">
  <div class="grid p-fluid align-items-center">
    <div class="col-4 text-right font-semibold">
      <label>Nome</label>
    </div>
    <div class="col-8">
      <input pInputText [(ngModel)]="newItem.nomePiano"/>
    </div>
    <div class="col-4 text-right font-semibold">
      <label>Descrizione</label>
    </div>
    <div class="col-8">
      <input pInputText  [(ngModel)]="newItem.descrizione" />
    </div>
    <div class="col-4 text-right font-semibold">
      <label>Note</label>
    </div>
    <div class="col-8">
      <input pInputText [(ngModel)]="newItem.note" />
    </div>
  </div>
  <button pButton label="Save" icon="pi pi-check" (click)="save()"></button>
</p-dialog>
