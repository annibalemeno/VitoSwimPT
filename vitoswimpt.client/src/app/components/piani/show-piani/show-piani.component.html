<p-table [value]="PianiList"
         dataKey="pianoId"
         editMode="row"
         [tableStyle]="{ 'min-width': '50rem' }" stripedRows
         [sortField]="sortField"
         [sortOrder]="sortOrder"
         [lazy]="true"
         (onLazyLoad)="loadPianiLazy($event)">
  <ng-template #header>
    <tr>
      <th pSortableColumn="pianoId">
        Id Piano
        <p-sortIcon field="IdPiano" />
      </th>
      <th pSortableColumn="nomePiano">
        Nome
        <p-sortIcon field="Nome" />
      </th>
      <th pSortableColumn="descrizione">
        Descrizione
        <p-sortIcon field="Descrizione" />
      </th>
      <th pSortableColumn="note">
        Note
        <p-sortIcon field="Note" />
      </th>
    </tr>
    <tr>
      <th>
        <p-columnFilter type="text" field="pianoId" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="nomePiano" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="descrizione" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="note" placeholder="Type to search" ariaLabel="Filter Name" filterOn="input"></p-columnFilter>
      </th>
      <th>
        <button pButton label="Add New" icon="pi pi-plus" (click)="openNew()"></button>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-piano let-editing="editing" let-ri="rowIndex">
    <tr [pEditableRow]="piano">
      <td>{{ piano.pianoId }}</td>
      <td>
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input pInputText type="text"
                   [(ngModel)]="piano.nomePiano" />
          </ng-template>
          <ng-template pTemplate="output">
            {{piano.nomePiano}}
          </ng-template>
        </p-cellEditor>
      </td>
      <td>
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input PInputText type="text"
                   [(ngModel)]="piano.descrizione" />
          </ng-template>
          <ng-template pTemplate="output">
            {{ piano.descrizione }}
          </ng-template>
        </p-cellEditor>
      </td>
      <td>
        <p-cellEditor>
          <ng-template pTemplate="input">
            <input PInputText type="text"
                   [(ngModel)]="piano.note" />
          </ng-template>
          <ng-template pTemplate="output">
            {{ piano.note }}
          </ng-template>
        </p-cellEditor>
      </td>
      <td>
        <div class="flex items-center justify-center gap-2"></div>
        <button *ngIf="!editing"
                pButton icon="pi pi-trash"
                (click)="deletePiano(piano)">
        </button>
        <button *ngIf="!editing"
                pButton
                pRipple
                type="button"
                pInitEditableRow
                icon="pi pi-pencil"
                (click)="onRowEditInit(piano)"
                text
                rounded></button>
        <button *ngIf="editing"
                pButton
                pRipple
                type="button"
                pSaveEditableRow
                icon="pi pi-check"
                (click)="onRowEditSave(piano)"
                text
                rounded></button>
        <button *ngIf="editing"
                pButton
                pRipple
                type="button"
                pCancelEditableRow
                icon="pi pi-times"
                (click)="onRowEditCancel(piano, ri)"
                text
                rounded></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [(visible)]="displayDialog" styleClass="dialog-fix" header="Nuovo piano">
  <div class="grid p-fluid align-items-center">
    <div class="col-4 text-right font-semibold">
      <label>Nome</label>
    </div>
    <div class="col-8">
      <input pInputText [(ngModel)]="newItem.nomePiano"/>
    </div>
    <div class="col-4 text-right font-semibold">
      <label>Descrizione</label>
    </div>
    <div class="col-8">
      <input pInputText  [(ngModel)]="newItem.descrizione" />
    </div>
    <div class="col-4 text-right font-semibold">
      <label>Note</label>
    </div>
    <div class="col-8">
      <input pInputText [(ngModel)]="newItem.note" />
    </div>
  </div>
  <button pButton label="Save" icon="pi pi-check" (click)="save()"></button>
</p-dialog>
